<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hyperion Zero</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: monospace; user-select: none; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #gameFrame { position: relative; width: 80vw; height: 100vh; overflow: hidden; background: #000; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; text-shadow: 1px 1px 0 #000; }
    .bar { width: 120px; height: 10px; background: #333; margin: 4px 0 10px; border: 1px solid #666; }
    .bar-inner { height: 100%; background: #f00; width: 100%; transition: width 0.1s; }
    #xpBar { background: #0ff; width: 0%; }
    #bossHpBar { background: #f0f; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; }
    .hidden { display: none !important; }
    button { margin: 5px; padding: 12px 20px; background: #111; color: #0ff; border: 1px solid #0ff; cursor: pointer; font-family: monospace; font-size: 14px; text-transform: uppercase; }
    button:hover { background: #0ff; color: #000; }
    #joystickZone { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; display: none; z-index: 15; touch-action: none; border: 1px solid rgba(255,255,255,0.2); }
    #joystickKnob { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: rgba(0,255,255,0.4); border-radius: 50%; pointer-events: none; }
    #upgradeOptions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 400px; margin-top: 15px; }
  </style>
</head>
<body>
  <div id="gameFrame">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div>SCORE: <span id="hudScore">0</span> | TIME: <span id="hudTime">0s</span></div>
      <div>LVL: <span id="hudLevel">1</span> (<span id="shipTierLabel">Tier 1</span>) | 🪙 <span id="hudCoins">0</span> | 💎 <span id="hudGems">0</span></div>
      <div>HP:</div><div class="bar"><div id="hpBar" class="bar-inner"></div></div>
      <div>XP:</div><div class="bar"><div id="xpBar" class="bar-inner"></div></div>
      <div id="bossHud" class="hidden">BOSS HP:<div class="bar"><div id="bossHpBar" class="bar-inner"></div></div></div>
    </div>
    <div id="joystickZone"><div id="joystickKnob"></div></div>
    
    <div id="startOverlay" class="overlay">
      <h1>HYPERION</h1>
      <p>WASD / Arrows to move. Auto-fire.</p>
      <p style="color: #0ff; font-size: 12px; margin-top: 5px;">HIGH SCORE: <span id="menuHighScore">0</span></p>
      <button id="startGameButton">START GAME</button>
    </div>
    <div id="levelUpOverlay" class="overlay hidden">
      <h2>LEVEL UP! CHOOSE UPGRADE:</h2>
      <div id="upgradeOptions"></div>
    </div>
    <div id="gameOverOverlay" class="overlay hidden">
      <h2>MISSION FAILED</h2>
      <p>Score: <span id="runScore">0</span> | Time: <span id="runTime">0s</span></p>
      <p style="color: #0ff;">High Score: <span id="highScoreDisplay">0</span></p>
      <button onclick="restartGame()">RELAUNCH FIGHTER</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const resizeCanvas = () => { canvas.width = window.innerWidth * 0.8; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resizeCanvas); resizeCanvas();

    let highScore = localStorage.getItem('hyperion_highscore') || 0;
    document.getElementById('menuHighScore').innerText = highScore;

    let audioCtx, noiseBuf;
    const initAudio = () => {
      if(!audioCtx) {
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
        noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate*1.5, audioCtx.sampleRate);
        const out = noiseBuf.getChannelData(0);
        for(let i=0; i<out.length; i++) out[i] = Math.random()*2-1;
      }
      if(audioCtx.state==='suspended') audioCtx.resume();
    };
    const playTone = (type, f1, f2, dur, vol) => {
      if(!audioCtx) return;
      try {
        const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(f1, t); osc.frequency.exponentialRampToValueAtTime(f2, t+dur);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+dur);
        osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t+dur);
      } catch(e){}
    };
    const sfxLaser = () => playTone('triangle',620,150,0.14,0.05);
    const sfxHit = () => playTone('triangle',220,40,0.08,0.2);
    const sfxCoin = () => playTone('sine',1318,1567,0.1,0.06);
    const sfxGem = () => playTone('sine',650,1300,0.1,0.04);
    const sfxUpgrade = () => playTone('sine',400,900,0.4,0.15);
    const sfxExplode = () => {
      if(!audioCtx||!noiseBuf) return;
      try {
        const t = audioCtx.currentTime, n = audioCtx.createBufferSource(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
        n.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(1200,t); f.frequency.exponentialRampToValueAtTime(30,t+0.45);
        g.gain.setValueAtTime(0.35,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
        n.connect(f); f.connect(g); g.connect(audioCtx.destination); n.start(t); n.stop(t+0.45);
        playTone('sine',130,25,0.5,0.4);
      } catch(e){}
    };

    const keys = {};
    window.addEventListener('keydown', e => { initAudio(); keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let touchVec = {x:0,y:0}, touchId=null, joyCenter={x:0,y:0};
    const joyZone = document.getElementById('joystickZone'), joyKnob = document.getElementById('joystickKnob');
    if('ontouchstart' in window || navigator.maxTouchPoints>0) joyZone.style.display = 'block';
    joyZone.addEventListener('touchstart', e => {
      initAudio(); touchId = e.changedTouches[0].identifier;
      const r = joyZone.getBoundingClientRect(); joyCenter = {x:r.left+r.width/2, y:r.top+r.height/2};
      updJoy(e.changedTouches[0]);
    }, {passive:false});
    joyZone.addEventListener('touchmove', e => { e.preventDefault(); for(let t of e.changedTouches) if(t.identifier===touchId) updJoy(t); }, {passive:false});
    const resJoy = () => { touchId=null; touchVec={x:0,y:0}; joyKnob.style.transform=`translate(0,0)`; };
    joyZone.addEventListener('touchend', resJoy); joyZone.addEventListener('touchcancel', resJoy);
    function updJoy(t) {
      const dx=t.clientX-joyCenter.x, dy=t.clientY-joyCenter.y, dist=Math.min(Math.hypot(dx,dy),40), ang=Math.atan2(dy,dx);
      touchVec = {x:(dist/40)*Math.cos(ang), y:(dist/40)*Math.sin(ang)};
      joyKnob.style.transform = `translate(${dist*Math.cos(ang)}px, ${dist*Math.sin(ang)}px)`;
    }

    let player, enemies, lasers, drops, particles, texts, stars, boss, gameTime, lastSpawn, isLevelUp, isGameOver, lastShot, shake;
    let gameStarted = false;
    const UPGRADES = [{id:'fireRate',n:'Fire Rate'},{id:'spread',n:'Multi-Beam'},{id:'laserSize',n:'Caliber'},{id:'speed',n:'Speed'},{id:'magnet',n:'Magnet'},{id:'maxHp',n:'Max HP'}];
    const ENEMY = {SCOUT:{s:90,r:14,hp:2,c:'#f43f5e',xp:1,t:'scout'}, FIGHTER:{s:110,r:20,hp:6,c:'#38bdf8',xp:3,t:'fighter'}, HEAVY:{s:55,r:32,hp:22,c:'#f59e0b',xp:10,t:'heavy'}, BOSS:{s:30,r:60,hp:300,c:'#a855f7',xp:100,t:'boss'}};

    const updHUD = () => {
      document.getElementById('hudLevel').innerText = player.level; document.getElementById('hudTime').innerText = Math.floor(gameTime)+'s';
      document.getElementById('hudScore').innerText = player.score; document.getElementById('hudCoins').innerText = player.coins; document.getElementById('hudGems').innerText = player.gems;
      document.getElementById('hpBar').style.width = Math.max(0,player.hp/player.maxHp*100)+'%';
      document.getElementById('xpBar').style.width = Math.min(100,player.xp/player.nextXp*100)+'%';
      player.tier = player.level>=12?4:player.level>=8?3:player.level>=4?2:1; document.getElementById('shipTierLabel').innerText = `Tier ${player.tier}`;
      if(boss) { document.getElementById('bossHud').classList.remove('hidden'); document.getElementById('bossHpBar').style.width = Math.max(0,boss.hp/boss.maxHp*100)+'%'; }
      else document.getElementById('bossHud').classList.add('hidden');
    };

    const init = () => {
      player = {x:canvas.width/2, y:canvas.height-120, speed:340, radius:20, hp:100, maxHp:100, laserSize:4, laserDamage:3, magnetRadius:160, fireRate:0.22, spreadCount:1, roll:0, xp:0, level:1, tier:1, nextXp:12, gems:0, coins:0, score:0, invuln:0};
      enemies=[]; lasers=[]; drops=[]; particles=[]; texts=[]; stars=[]; boss=null; gameTime=0; lastSpawn=0; lastShot=0; shake=0; isLevelUp=false; isGameOver=false;
      for(let i=0;i<120;i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*1.5+0.5, sp:Math.random()*80+30, a:Math.random()*0.7+0.3});
      updHUD(); document.getElementById('levelUpOverlay').classList.add('hidden'); document.getElementById('gameOverOverlay').classList.add('hidden');
    };

    document.getElementById('startGameButton').onclick = () => { gameStarted=true; init(); document.getElementById('startOverlay').classList.add('hidden'); };

    const spawnP = (x,y,c,cnt) => { for(let i=0;i<cnt;i++) { const a=Math.random()*Math.PI*2, s=Math.random()*180+40; particles.push({x,y,vx:Math.cos(a)*s, vy:Math.sin(a)*s, l:1, ml:Math.random()*0.4+0.2, sz:Math.random()*4+2, c}); } };
    const spawnT = (x,y,t,c) => texts.push({x,y,t,l:0.7,c,vy:-60});

    const dmg = (e, d) => {
      e.hp-=d; e.hf=0.08; sfxHit(); spawnT(e.x, e.y-e.r, d, '#fff');
      if(e.hp<=0) {
        player.score += e.t==='boss'?500:e.t==='heavy'?75:e.t==='fighter'?25:10; sfxExplode(); spawnP(e.x,e.y,e.c,e.t==='boss'?60:20); shake=Math.max(shake, e.r/5);
        for(let k=0;k<Math.min(e.xp,12);k++) drops.push({x:e.x+(Math.random()-0.5)*e.r, y:e.y+(Math.random()-0.5)*e.r, r:4, v:Math.ceil(e.xp/Math.min(e.xp,12)), m:false, t:'gem', c:'#0ff'});
        const cCnt = Math.floor(Math.random()*2)+(e.t==='boss'?25:1);
        for(let c=0;c<cCnt;c++) drops.push({x:e.x+(Math.random()-0.5)*e.r, y:e.y+(Math.random()-0.5)*e.r, r:5, v:10+Math.floor(Math.random()*15), m:false, t:'coin', c:'#fd0'});
        if(e.t==='boss') boss=null; enemies.splice(enemies.indexOf(e),1);
      }
    };

    const lvlUp = () => {
      isLevelUp = true; sfxUpgrade(); document.getElementById('levelUpOverlay').classList.remove('hidden');
      const box = document.getElementById('upgradeOptions'); box.innerHTML = '';
      [...UPGRADES].sort(()=>0.5-Math.random()).slice(0,3).forEach(u => {
        const b = document.createElement('button'); b.innerText = u.n;
        b.onclick = () => {
          if(u.id==='fireRate') player.fireRate=Math.max(0.06,player.fireRate-0.03); else if(u.id==='spread') player.spreadCount++; else if(u.id==='laserSize') {player.laserSize+=1.5; player.laserDamage+=2;}
          else if(u.id==='speed') player.speed+=40; else if(u.id==='magnet') player.magnetRadius+=60; else if(u.id==='maxHp') {player.maxHp+=25; player.hp=player.maxHp;}
          updHUD(); document.getElementById('levelUpOverlay').classList.add('hidden'); isLevelUp = false;
        }; box.appendChild(b);
      });
    };

    let lastT = performance.now();
    const loop = (tm) => {
      const dt = Math.min((tm-lastT)/1000, 0.1); lastT = tm; const now = tm/1000;
      if(!gameStarted) return requestAnimationFrame(loop);
      if(!isLevelUp && !isGameOver) {
        gameTime+=dt; if(player.invuln>0) player.invuln-=dt; if(shake>0) shake-=dt*10;
        stars.forEach(s => { s.y+=s.sp*dt; if(s.y>canvas.height) { s.y=0; s.x=Math.random()*canvas.width; } });

        let dx=0, dy=0;
        if(keys['w']||keys['arrowup']) dy-=1; if(keys['s']||keys['arrowdown']) dy+=1; if(keys['a']||keys['arrowleft']) dx-=1; if(keys['d']||keys['arrowright']) dx+=1;
        if(touchVec.x||touchVec.y) { dx=touchVec.x; dy=touchVec.y; } else if(dx&&dy) { dx*=0.707; dy*=0.707; }
        player.roll += (dx*0.35 - player.roll)*12*dt;
        player.x = Math.max(player.radius, Math.min(canvas.width-player.radius, player.x+dx*player.speed*dt));
        player.y = Math.max(player.radius+10, Math.min(canvas.height-player.radius, player.y+dy*player.speed*dt));

        if(now-lastShot >= player.fireRate) {
          lastShot = now; sfxLaser();
          const c=player.spreadCount, ang = Math.min(0.7, (c-1)*0.15), st = -ang/2;
          for(let i=0;i<c;i++) {
            const a = -Math.PI/2 + (c===1?0:st+(ang/(c-1))*i);
            lasers.push({x:player.x, y:player.y-player.radius, vx:Math.cos(a)*1100, vy:Math.sin(a)*1100, r:player.laserSize, d:player.laserDamage, c:'#0ff'});
          }
        }

        if(Math.floor(gameTime)>0 && Math.floor(gameTime)%60===0 && !boss) { boss = {x:canvas.width/2,y:-80, ...ENEMY.BOSS, maxHp:300+player.level*40, hp:300+player.level*40, hf:0}; enemies.push(boss); }
        if(now-lastSpawn > Math.max(0.35, 1.8*Math.exp(-0.015*gameTime))) {
          lastSpawn = now; let t = ENEMY.SCOUT, r = Math.random();
          if(gameTime>20 && r<0.4) t=ENEMY.FIGHTER; else if(gameTime>40 && r>0.75) t=ENEMY.HEAVY;
          enemies.push({x:Math.random()*(canvas.width-60)+30, y:-40, ...t, hp:t.hp+Math.floor(gameTime/25), hf:0});
        }

        for(let i=particles.length-1;i>=0;i--) { let p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.l-=dt/p.ml; if(p.l<=0) particles.splice(i,1); }
        for(let i=texts.length-1;i>=0;i--) { let t=texts[i]; t.y+=t.vy*dt; t.l-=dt; if(t.l<=0) texts.splice(i,1); }

        for(let i=lasers.length-1;i>=0;i--) {
          let l=lasers[i], hit=false; l.x+=l.vx*dt; l.y+=l.vy*dt;
          if(l.y<-50||l.x<-50||l.x>canvas.width+50) { lasers.splice(i,1); continue; }
          for(let e of enemies) if(Math.hypot(e.x-l.x, e.y-l.y) <= l.r+e.r) { dmg(e, l.d); lasers.splice(i,1); hit=true; break; }
        }

        for(let i=drops.length-1;i>=0;i--) {
          let d=drops[i], dSq=(player.x-d.x)**2+(player.y-d.y)**2; d.y+=45*dt;
          if(dSq<=player.magnetRadius**2) d.m=true;
          if(d.m) { const dst=Math.sqrt(dSq); if(dst>0) { d.x+=(player.x-d.x)/dst*750*dt; d.y+=(player.y-d.y)/dst*750*dt; } }
          if(dSq<=(player.radius+d.r)**2) {
            if(d.t==='gem') { player.xp+=d.v; player.gems+=d.v; sfxGem(); spawnT(player.x, player.y-20, `+${d.v} XP`, '#0ff'); }
            else { player.coins+=d.v; sfxCoin(); spawnT(player.x, player.y-20, `+${d.v} 🪙`, '#fd0'); }
            drops.splice(i,1); updHUD();
            if(player.xp>=player.nextXp) { player.level++; player.xp-=player.nextXp; player.nextXp=Math.floor(player.nextXp*1.45); lvlUp(); }
          } else if(d.y>canvas.height+50) drops.splice(i,1);
        }

        for(let i=enemies.length-1;i>=0;i--) {
          let e=enemies[i]; e.y+=e.s*dt; if(e.hf>0) e.hf-=dt;
          if(e.t==='boss'&&e.y>100) e.y=100; if(e.y>canvas.height+80) { enemies.splice(i,1); continue; }
          if(Math.hypot(player.x-e.x, player.y-e.y) <= player.radius+e.r && player.invuln<=0) {
            player.hp-=e.t==='boss'?40:20; player.invuln=0.6; sfxExplode(); shake = e.t==='scout'?3:e.t==='fighter'?6:e.t==='heavy'?10:16;
            updHUD(); spawnP(player.x, player.y, '#f00', 25);
            if(player.hp<=0) {
              player.hp=0; isGameOver=true; updHUD();
              
              if (player.score > highScore) {
                highScore = player.score;
                localStorage.setItem('hyperion_highscore', highScore);
              }

              document.getElementById('runScore').innerText=player.score;
              document.getElementById('runTime').innerText=Math.floor(gameTime)+'s';
              document.getElementById('highScoreDisplay').innerText=highScore;
              document.getElementById('menuHighScore').innerText=highScore;
              document.getElementById('gameOverOverlay').classList.remove('hidden');
            }
          }
        }
      }

      ctx.save(); ctx.clearRect(0,0,canvas.width,canvas.height);
      if(shake>0) ctx.translate((Math.random()-0.5)*shake*1.5, (Math.random()-0.5)*shake*1.5);

      stars.forEach(s => { ctx.fillStyle='#fff'; ctx.globalAlpha=s.a; ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1;
      ctx.globalCompositeOperation='lighter';
      particles.forEach(p => { ctx.fillStyle=p.c; ctx.globalAlpha=p.l; ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,Math.PI*2); ctx.fill(); });
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

      drops.forEach(d => { ctx.fillStyle=d.c; ctx.beginPath(); if(d.t==='gem') { ctx.moveTo(d.x,d.y-d.r); ctx.lineTo(d.x+d.r,d.y); ctx.lineTo(d.x,d.y+d.r); ctx.lineTo(d.x-d.r,d.y); } else ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); });

      ctx.globalCompositeOperation='lighter';
      lasers.forEach(l => { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(l.x,l.y,l.r,l.r*2.5,0,0,Math.PI*2); ctx.fill(); });
      ctx.globalCompositeOperation='source-over';

      enemies.forEach(e => {
        ctx.save(); ctx.translate(e.x,e.y); ctx.fillStyle=e.hf>0?'#fff':'#111'; ctx.strokeStyle=e.hf>0?'#fff':e.c; ctx.lineWidth=2;
        ctx.beginPath(); if(e.t==='scout') { ctx.moveTo(0,16); ctx.lineTo(12,-12); ctx.lineTo(0,-6); ctx.lineTo(-12,-12); }
        else if(e.t==='fighter') { ctx.moveTo(0,20); ctx.lineTo(18,0); ctx.lineTo(10,-16); ctx.lineTo(-10,-16); ctx.lineTo(-18,0); }
        else if(e.t==='heavy') { ctx.moveTo(0,28); ctx.lineTo(26,10); ctx.lineTo(20,-22); ctx.lineTo(-20,-22); ctx.lineTo(-26,10); }
        else { ctx.moveTo(0,50); ctx.lineTo(45,20); ctx.lineTo(55,-20); ctx.lineTo(20,-45); ctx.lineTo(-20,-45); ctx.lineTo(-55,-20); ctx.lineTo(-45,20); }
        ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      });

      if(player.hp>0) {
        ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(player.roll);
        if(player.invuln>0) { ctx.strokeStyle=`rgba(0,255,255,${Math.abs(Math.sin(performance.now()/60))})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,player.radius+12,0,Math.PI*2); ctx.stroke(); }
        ctx.fillStyle='#111'; ctx.strokeStyle='#0ff'; ctx.lineWidth=2; ctx.beginPath();
        if(player.tier===1) { ctx.moveTo(0,-22); ctx.lineTo(18,12); ctx.lineTo(6,6); ctx.lineTo(8,16); ctx.lineTo(-8,16); ctx.lineTo(-6,6); ctx.lineTo(-18,12); }
        else if(player.tier===2) { ctx.moveTo(0,-26); ctx.lineTo(8,-10); ctx.lineTo(24,10); ctx.lineTo(12,14); ctx.lineTo(0,8); ctx.lineTo(-12,14); ctx.lineTo(-24,10); ctx.lineTo(-8,-10); }
        else if(player.tier===3) { ctx.moveTo(0,-28); ctx.lineTo(10,-12); ctx.lineTo(28,6); ctx.lineTo(28,16); ctx.lineTo(14,18); ctx.lineTo(0,10); ctx.lineTo(-14,18); ctx.lineTo(-28,16); ctx.lineTo(-28,6); ctx.lineTo(-10,-12); }
        else { ctx.moveTo(0,-32); ctx.lineTo(12,-16); ctx.lineTo(32,0); ctx.lineTo(32,18); ctx.lineTo(18,20); ctx.lineTo(0,12); ctx.lineTo(-18,20); ctx.lineTo(-32,18); ctx.lineTo(-32,0); ctx.lineTo(-12,-16); }
        ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }

      texts.forEach(t => { ctx.fillStyle=t.c; ctx.globalAlpha=Math.max(0,t.l); ctx.font='bold 16px sans-serif'; ctx.fillText(t.t,t.x-8,t.y); });
      ctx.globalAlpha=1; ctx.restore();
      if(Math.floor(gameTime)%1===0) updHUD();
      requestAnimationFrame(loop);
    };

    const restartGame = () => { init(); document.getElementById('gameOverOverlay').classList.add('hidden'); gameStarted=true; };
    init(); gameStarted=false; requestAnimationFrame(loop);
  </script>
</body>
</html>

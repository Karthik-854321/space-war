<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space War</title>

  <style>
    :root {
      --bg: #02040a;
      --blue: #1687ff;
      --text: #ffffff;
      --muted: #aeb7c4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button {
      font: inherit;
    }

    /* ---------- Selection Page ---------- */

    #selectionView {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 16px;
      overflow: hidden;
      background-color: #02040a;
      background-image:
        linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px);
      background-size: 34px 34px;
      background-position: center;
    }

    .arena {
      width: min(1180px, 100%);
      min-height: min(680px, calc(100dvh - 32px));

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(150px, 0.55fr)
        minmax(0, 1fr);

      align-items: center;
    }

    /* ---------- Game Modes ---------- */

    .zone {
      min-height: 470px;
      padding: clamp(26px, 4vw, 48px);

      display: flex;
      flex-direction: column;
      justify-content: center;

      position: relative;
      z-index: 1;
      background: rgba(2, 4, 10, 0.82);
      border: 2px solid rgba(22, 135, 255, 0.85);

      cursor: pointer;
    }

    .zone.left {
      clip-path: polygon(0 0, 100% 12%, 78% 50%, 100% 88%, 0 100%);
      padding-right: clamp(72px, 9vw, 120px);
    }

    .zone.right {
      clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 88%, 22% 50%);
      padding-left: clamp(72px, 9vw, 120px);
    }

    .zone.active {
      background: rgba(3, 27, 50, 0.7);
      border-color: var(--blue);
    }

    .zone-title {
      margin: 0 0 8px;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      color: var(--blue);
    }

    .zone-label {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ---------- Records ---------- */

    .zone-records {
      width: 100%;
      margin-bottom: 18px;
      padding: 10px 12px;

      display: grid;
      gap: 7px;

      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(22, 135, 255, 0.55);
      border-left: 3px solid var(--blue);
    }

    .record {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      padding: 6px 0;

      border-bottom: 1px solid rgba(174, 183, 196, 0.25);
      font-size: 13px;
    }

    .record:last-child {
      border-bottom: 0;
    }

    .record span {
      color: var(--muted);
    }

    .record strong {
      min-width: 45px;
      text-align: right;
      color: white;
      font-size: 15px;
    }

    /* ---------- Buttons ---------- */

    .select-mode,
    .play-main {
      padding: 11px 16px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      border: 1px solid var(--blue);

      font-weight: bold;
      letter-spacing: 0.08em;

      cursor: pointer;
    }

    .zone.active .select-mode {
      background: var(--blue);
    }

    /* ---------- Center Play ---------- */

    .play-core {
      position: relative;
      z-index: 5;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 18px;
    }

    #selectedMode {
      margin-bottom: 12px;

      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .play-main {
      min-width: 140px;
      padding: 16px 26px;
      background: var(--blue);
    }

    /* ---------- Mobile ---------- */

    @media (max-width: 760px) {
      #selectionView {
        padding: 8px;
        overflow: auto;
      }

      .arena {
        min-height: calc(100dvh - 16px);

        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto 1fr;
      }

      .zone {
        min-height: 0;
        padding: 22px;

        clip-path: none !important;
      }

      .zone.left {
        order: 1;
        padding-right: 22px;
      }

      .play-core {
        order: 2;
        padding: 14px;
      }

      .zone.right {
        order: 3;
        padding-left: 22px;
      }

      .zone-title {
        font-size: 42px;
      }

      .zone-records {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 8px;
      }

      .record {
        display: block;
        border-bottom: 0;
        font-size: 10px;
      }

      .record strong {
        display: block;
        margin-top: 4px;
        text-align: left;
        font-size: 13px;
      }
    }

    @media (max-width: 430px) {
      .zone,
      .zone.left,
      .zone.right {
        padding: 16px;
      }

      .zone-label {
        margin-bottom: 10px;
      }

      .zone-records {
        margin-bottom: 10px;
      }
    }
  </style>
</head>

<body>

  <section id="selectionView">

    <main class="arena">

      <!-- 180 MODE -->
      <article class="zone left active" data-mode="180">

        <h1 class="zone-title">180°</h1>

        <p class="zone-label">
          Forward War Zone
        </p>

        <div class="zone-records">

          <div class="record">
            <span>Best Score</span>
            <strong id="score180">0</strong>
          </div>

          <div class="record">
            <span>Best Time</span>
            <strong id="time180">0s</strong>
          </div>

          <div class="record">
            <span>Runs</span>
            <strong id="runs180">0</strong>
          </div>

        </div>

        <button class="select-mode" type="button">
          SELECT 180°
        </button>

      </article>


      <!-- CENTER PLAY -->
      <section class="play-core">

        <div id="selectedMode">
          180° SELECTED
        </div>

        <button
          id="playSelected"
          class="play-main"
          type="button"
        >
          PLAY
        </button>

      </section>


      <!-- 360 MODE -->
      <article class="zone right" data-mode="360">

        <h1 class="zone-title">360°</h1>

        <p class="zone-label">
          Open War Zone
        </p>

        <div class="zone-records">

          <div class="record">
            <span>Best Score</span>
            <strong id="score360">0</strong>
          </div>

          <div class="record">
            <span>Best Time</span>
            <strong id="time360">0s</strong>
          </div>

          <div class="record">
            <span>Runs</span>
            <strong id="runs360">0</strong>
          </div>

        </div>

        <button class="select-mode" type="button">
          SELECT 360°
        </button>

      </article>

    </main>

  </section>


  <script>
    let selectedMode = "180";

    const zones = document.querySelectorAll(".zone");
    const selectedModeText =
      document.getElementById("selectedMode");

    const playButton =
      document.getElementById("playSelected");


    function selectMode(mode) {
      selectedMode = mode;

      zones.forEach(zone => {
        zone.classList.toggle(
          "active",
          zone.dataset.mode === mode
        );
      });

      selectedModeText.textContent =
        mode + "° SELECTED";
    }


    zones.forEach(zone => {

      zone.addEventListener("click", () => {
        selectMode(zone.dataset.mode);
      });

      const button =
        zone.querySelector(".select-mode");

      button.addEventListener("click", event => {
        event.stopPropagation();

        selectMode(zone.dataset.mode);
      });

    });


    playButton.addEventListener("click", () => {
      if (selectedMode === "180") {
        window.location.href = "180-game.html";
      } else {
        window.location.href = "360-game.html";
      }
    });
  </script>

</body>
</html>
